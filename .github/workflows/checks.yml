name: Offline checks
on:
  push:
  pull_request:
jobs:
  self-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Offline transaction and MCP registration checks
        run: python -m worldpainter_mcp --self-test
# Real WorldPainter integrations require a local installation; see README.
